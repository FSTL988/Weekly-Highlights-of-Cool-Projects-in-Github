<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Weekly Highlights</title>
<style>
:root{color-scheme:light dark}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,
"Helvetica Neue",Arial,"Noto Sans","PingFang SC","Hiragino Sans GB",
"Microsoft YaHei",sans-serif;line-height:1.65;color:#1f2937;background:#fff}
@media(prefers-color-scheme:dark){
  body{color:#e5e7eb;background:#111827}
  a{color:#7dd3fc}
  code{background:#1f2937}
  pre{background:#1f2937}
  th{background:#1f2937}
  td,th{border-color:#374151}
  .langbar{background:#1f2937;border-color:#374151}
}
.topbar{position:sticky;top:0;z-index:10;display:flex;flex-wrap:wrap;gap:.5rem;
align-items:center;justify-content:space-between;padding:.6rem 1rem;
background:#0f172a;color:#fff}
.topbar a{color:#fff;text-decoration:none;font-weight:600}
.topbar .langbar{display:flex;align-items:center;gap:.5rem;font-size:.95rem}
.topbar select{font:inherit;padding:.35rem .5rem;border-radius:.5rem;
border:1px solid #cbd5e1;background:#fff;color:#0f172a;cursor:pointer}
main{max-width:860px;margin:0 auto;padding:1.25rem 1rem 3rem}
h1{font-size:1.8rem;line-height:1.3}
h2{font-size:1.4rem;margin-top:2rem;border-bottom:1px solid #e5e7eb;padding-bottom:.3rem}
h3{font-size:1.15rem}
a{color:#0369a1}
a:hover{text-decoration:underline}
img{max-width:100%;height:auto}
pre{overflow-x:auto;background:#f3f4f6;padding:1rem;border-radius:.5rem}
code{background:#f3f4f6;padding:.1rem .3rem;border-radius:.3rem;font-size:.92em}
pre code{background:none;padding:0}
blockquote{margin:1rem 0;padding:.5rem 1rem;border-left:4px solid #38bdf8;
background:#f0f9ff;color:#334155}
@media(prefers-color-scheme:dark){blockquote{background:#0c1a2b;color:#cbd5e1}}
.table-scroll{overflow-x:auto;margin:1rem 0}
table{border-collapse:collapse;width:100%;font-size:.95rem}
th,td{border:1px solid #d1d5db;padding:.45rem .6rem;text-align:left;vertical-align:top}
th{background:#f1f5f9;white-space:nowrap}
.issue-list{list-style:none;padding:0}
.issue-list li{padding:.6rem 0;border-bottom:1px solid #e5e7eb}
.issue-list a{font-weight:600;text-decoration:none}
.issue-list .date{color:#6b7280;font-size:.9rem;margin-left:.5rem}
.lang-links{list-style:none;padding:0;display:grid;gap:.5rem}
.lang-links a{display:block;padding:.7rem 1rem;border:1px solid #d1d5db;
border-radius:.5rem;text-decoration:none;font-weight:600}
@media(max-width:640px){
  h1{font-size:1.45rem}
  main{padding:1rem .9rem 2.5rem}
  .topbar{padding:.55rem .8rem}
}
</style>
</head>
<body>
<header class="topbar"><a class="brand" href="index.html">Weekly Highlights</a><label class="langbar">🌐 <span>Language / 语言</span> <select id="lang-select" aria-label="Language / 语言"><option value="zh" data-url="zh/index.html">中文</option><option value="en" data-url="en/index.html" selected>English</option><option value="fr" data-url="fr/index.html">Français</option><option value="ja" data-url="ja/index.html">日本語</option><option value="ko" data-url="ko/index.html">한국어</option><option value="es" data-url="es/index.html">Español</option></select></label></header>
<main>
<h1>Weekly Highlights</h1>
<p>Choose your language / 请选择语言：</p>
<ul class="lang-links">
<li><a href="zh/index.html">中文</a></li><li><a href="en/index.html">English</a></li><li><a href="fr/index.html">Français</a></li><li><a href="ja/index.html">日本語</a></li><li><a href="ko/index.html">한국어</a></li><li><a href="es/index.html">Español</a></li>
</ul>
<noscript><p>JavaScript is disabled — please pick a language above.</p></noscript>

</main>

<script>
(function(){
  var KEY='gh-weekly-lang';
  var sel=document.getElementById('lang-select');
  if(!sel) return;
  sel.addEventListener('change',function(){
    var opt=sel.options[sel.selectedIndex];
    if(!opt||!opt.value) return;
    try{localStorage.setItem(KEY,opt.value);}catch(e){}
    window.location.href=opt.getAttribute('data-url');
  });
})();
</script>


<script>
(function(){
  var KEY='gh-weekly-lang';
  var langs=['zh','en','fr','ja','ko','es'];
  var lang=null;
  try{lang=localStorage.getItem(KEY);}catch(e){}
  if(!lang||langs.indexOf(lang)===-1){
    var nav=(navigator.language||navigator.userLanguage||'en').toLowerCase();
    var primary=nav.split('-')[0];
    lang=langs.indexOf(primary)!==-1?primary:'en';
  }
  window.location.replace(lang+'/index.html');
})();
</script>
</body>
</html>
